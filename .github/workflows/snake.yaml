
name: Generate GitHub Contribution Snake

on:
  # Generate the animation every day at midnight UTC
  schedule:
    - cron: "0 0 * * *"

  # Allow manual execution from GitHub Actions
  workflow_dispatch:

# Allow the workflow to publish generated files
permissions:
  contents: write

jobs:
  generate:
    name: Generate and publish snake
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Generate light and dark contribution animations
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: aishzy
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      # Publish generated SVGs to the output branch
      - name: Publish snake SVGs
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
